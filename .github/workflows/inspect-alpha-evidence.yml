name: Inspect alpha candidate evidence

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Source evaluation run
        type: string
        required: true
      artifact_name:
        description: Evaluation artifact name
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          name: ${{ inputs.artifact_name }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/candidate
      - name: Print fictional evaluation answers and exact manifest
        run: |
          python - <<'PY'
          import json,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'candidate'
          for name in ('candidate-results.json','hf-reference.json','model-manifest.json'):
              path=root/name
              if path.is_file():
                  data=json.loads(path.read_text())
                  if name!='model-manifest.json':
                      data={k:v for k,v in data.items() if k not in ('parity','packages','source_files')}
                  print(name+' '+json.dumps(data,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: lightweight-evaluation-evidence
          path: |
            ${{ runner.temp }}/candidate/**
            !${{ runner.temp }}/candidate/**/*.gguf
          if-no-files-found: error
          retention-days: 14
