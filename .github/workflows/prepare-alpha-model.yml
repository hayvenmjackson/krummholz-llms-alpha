name: Prepare verified alpha model

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Quantize pinned model and compare actual CPU completions
        run: python -B tools/prepare_alpha_model.py --work "$RUNNER_TEMP/model-work" --output "$RUNNER_TEMP/alpha-model"
      - name: Retain model and evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha-model
          path: ${{ runner.temp }}/alpha-model/
          if-no-files-found: error
          retention-days: 14
