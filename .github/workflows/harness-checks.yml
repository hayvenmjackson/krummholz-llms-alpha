name: Offline harness checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Standard-library checks only: no dependencies, model weights or inference.
      - name: Run unit tests
        run: python -B -m unittest discover -s tests -v
      - name: Validate synthetic smoke cases without inference
        run: python -B -m krummholz_llm.smoke --dry-run --output "$RUNNER_TEMP/smoke-dry-run.json"
