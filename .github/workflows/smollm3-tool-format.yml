name: SmolLM3 publisher tool-format diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
      CUDA_VISIBLE_DEVICES: ""
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the unchanged original-reference CPU runtime
        timeout-minutes: 6
        run: |
          python -m pip install --disable-pip-version-check torch==2.9.1+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check transformers==4.57.1 tokenizers==0.22.2 safetensors==0.6.2 huggingface-hub==0.36.0
          python -m pip check
          mkdir -p "$RUNNER_TEMP/tool-format-reference"
          python -m pip freeze > "$RUNNER_TEMP/tool-format-reference/python-packages.txt"
      - name: Check source and parser helpers without model execution
        run: python -B tools/check_smollm3_reference.py --self-test
      - name: Compare only the tool schema rendering with original BF16 weights
        timeout-minutes: 23
        run: |
          python -B tools/check_smollm3_reference.py --tool-format-diagnostic \
            --work "$RUNNER_TEMP/smollm3-source" --output "$RUNNER_TEMP/tool-format-reference"
      - name: Preserve every format variant and its exact prompt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smollm3-tool-format
          path: ${{ runner.temp }}/tool-format-reference/
          if-no-files-found: error
          retention-days: 14
