name: Diagnose publisher tokenizer framing

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install tokenizers==0.22.2
      - name: Prepare pinned models and retain existing failure evidence
        continue-on-error: true
        run: python -B tools/prepare_alpha_model.py --work "$RUNNER_TEMP/model-work" --output "$RUNNER_TEMP/alpha-model"
      - name: Compare tokenizer IDs and controlled actual completions
        run: python -B tools/diagnose_pleias_framing.py --work "$RUNNER_TEMP/model-work" --model-output "$RUNNER_TEMP/alpha-model" --output "$RUNNER_TEMP/framing-diagnostic" --timeout 90
      - name: Retain diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: framing-diagnostic
          path: ${{ runner.temp }}/framing-diagnostic/
          if-no-files-found: error
          retention-days: 14
      - name: Retain original model evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha-model
          path: ${{ runner.temp }}/alpha-model/
          if-no-files-found: error
          retention-days: 14
