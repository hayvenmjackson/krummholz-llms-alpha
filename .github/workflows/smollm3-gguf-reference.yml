name: SmolLM3 direct BF16 GGUF reference

on:
  workflow_dispatch:
    inputs:
      hf_reference_run_id:
        description: Original seven-case HF reference run to compare unchanged prompts
        type: string
        default: "40321308880"
        required: true
      retain_model:
        description: Retain the large hosted model artifact after integrity and tokenizer checks
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
      CUDA_VISIBLE_DEVICES: ""
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: 620d2225cc436ab0b001e3200e590e3b286ef9ab
          path: vendor/llama.cpp
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Retrieve only the small original reference evidence
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.hf_reference_run_id }}
          name: smollm3-reference
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/hf-reference
      - name: Install pinned conversion packages
        timeout-minutes: 7
        run: |
          python -m pip install --disable-pip-version-check torch==2.11.0+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check transformers==4.57.6 tokenizers==0.22.2 safetensors==0.6.2 huggingface-hub==0.36.0 numpy==2.2.6 sentencepiece==0.2.1 protobuf==4.25.8
          python -m pip install --disable-pip-version-check --no-deps ./vendor/llama.cpp/gguf-py
          python -m pip check
          mkdir -p "$RUNNER_TEMP/gguf-reference"
          python -m pip freeze > "$RUNNER_TEMP/gguf-reference/python-packages.txt"
      - name: Check small diagnostic helpers
        run: python -B tools/check_smollm3_gguf_reference.py --self-test
      - name: Verify source, convert original BF16 and compare exact seven prompts
        timeout-minutes: 30
        env:
          HF_REFERENCE_RUN_ID: ${{ inputs.hf_reference_run_id }}
        run: |
          python -B tools/check_smollm3_gguf_reference.py --llama-source vendor/llama.cpp \
            --hf-reference "$RUNNER_TEMP/hf-reference" --work "$RUNNER_TEMP/gguf-work" \
            --output "$RUNNER_TEMP/gguf-reference"
      - name: Retain lightweight conversion and inference evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smollm3-gguf-reference
          path: ${{ runner.temp }}/gguf-reference/
          if-no-files-found: error
          retention-days: 14
      - name: Retain requested hosted BF16 candidate without releasing it
        if: success() && inputs.retain_model
        uses: actions/upload-artifact@v4
        with:
          name: smollm3-bf16-gguf-candidate
          path: |
            ${{ runner.temp }}/gguf-work/SmolLM3-3B-BF16.gguf
            ${{ runner.temp }}/gguf-reference/model-manifest.json
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
